name: Daily tender crawl

on:
  schedule:
    # 21:30 UTC = 03:00 IST. The later entries are retries (04:00, 05:00, 06:00, 07:30 IST):
    # they skip themselves once a complete crawl has succeeded today.
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.done.outputs.done }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'

      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule'
        with:
          python-version: "3.12"
          cache: pip

      - name: Has today's crawl already succeeded?
        id: done
        if: github.event_name == 'schedule'
        run: |
          pip install -q -r requirements.txt
          python -m crawler.main --done-today eproc

  crawl:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser tests
        run: python -m pytest -q tests

      - name: Crawl, de-duplicate, analyse, build site
        id: crawl
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m crawler.main

      - name: Commit tender database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily crawl $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Fail the run if the crawl failed
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "Crawl step failed - the site was published with the previous data."
          exit 1

  deploy:
    needs: crawl
    if: always() && (needs.crawl.result == 'success' || needs.crawl.result == 'failure')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
