name: Daily tender crawl

on:
  schedule:
    # 03:00 UTC = 08:30 IST. Scheduled runs often start a few minutes late,
    # so starting at 08:30 makes the report ready by 09:00 IST.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser tests
        run: python -m pytest -q tests

      - name: Crawl, de-duplicate, analyse, build site
        id: crawl
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m crawler.main

      - name: Commit tender database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily crawl $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Fail the run if the crawl failed
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "Crawl step failed - the site was published with the previous data."
          exit 1

  deploy:
    needs: crawl
    if: always() && needs.crawl.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
