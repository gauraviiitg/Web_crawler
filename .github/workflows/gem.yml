name: GeM bids (this PC)

# GeM (bidplus.gem.gov.in) refuses connections from GitHub's cloud runners, so this job runs on
# the owner's PC (self-hosted runner with the "gem" label). If the PC is off, the run waits in
# the queue and starts when the runner comes online (GitHub drops it after 24 hours).
# Steps use cmd and the PC's own Python: PowerShell scripts are blocked by the execution policy.
on:
  schedule:
    # 21:30 UTC = 03:00 IST. The later entries are retries (04:00, 05:00, 06:00, 07:30 IST):
    # they skip themselves once a complete GeM snapshot was fetched today.
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gem-bids
  cancel-in-progress: false

jobs:
  gem:
    runs-on: [self-hosted, Windows, gem]
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      # actions/checkout gets no output from Git for Windows' cmd\git.exe wrapper under the runner
      # and falls back to a tarball without .git; the real git.exe works.
      - name: Use Git's own git.exe
        run: echo C:\Program Files\Git\mingw64\bin>>"%GITHUB_PATH%"

      - uses: actions/checkout@v5

      - name: Python environment
        run: |
          py -3 -m venv .venv || exit /b 1
          .venv\Scripts\python -m pip install -q -r requirements.txt

      - name: Has today's GeM fetch already succeeded?
        id: done
        if: github.event_name == 'schedule'
        run: .venv\Scripts\python -m crawler.main --done-today gem

      - name: Fetch GeM bids for Rajasthan (3 attempts, 5 minutes apart)
        if: steps.done.outputs.done != 'true'
        run: .venv\Scripts\python -m crawler.main --gem-snapshot data/gem_bids.json

      - name: Commit GeM snapshot
        if: steps.done.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gem_bids.json
          git diff --cached --quiet && (echo No GeM changes& exit /b 0)
          git commit -m "GeM bids (fetched on the owner's PC)" || exit /b 1
          for /L %%i in (1,1,3) do (
            git pull --rebase && git push && exit /b 0
            ping -n 16 127.0.0.1 >nul
          )
          exit /b 1

      - name: Rebuild the site with the new bids
        if: steps.done.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml -R ${{ github.repository }}
