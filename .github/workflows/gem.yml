name: GeM bids (this PC)

# GeM (bidplus.gem.gov.in) refuses connections from GitHub's cloud runners, so this job runs on
# the owner's PC (self-hosted runner with the "gem" label). If the PC is off, the run waits in
# the queue and starts when the runner comes online (GitHub drops it after 24 hours).
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, before the 08:30 IST daily crawl
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gem-bids
  cancel-in-progress: false

jobs:
  gem:
    runs-on: [self-hosted, Windows, gem]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Fetch GeM bids for Rajasthan
        run: python -m crawler.main --gem-snapshot data/gem_bids.json

      - name: Commit GeM snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gem_bids.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "No GeM changes"; exit 0 }
          $stamp = [DateTime]::UtcNow.AddHours(5.5).ToString("yyyy-MM-dd HH:mm")
          git commit -m "GeM bids $stamp IST"
          for ($i = 0; $i -lt 3; $i++) {
            git pull --rebase
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 15
          }
          exit 1

      - name: Rebuild the site with the new bids
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml -R ${{ github.repository }}
