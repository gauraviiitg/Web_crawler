# Portal to crawl (NIC GePNIC software). Other NIC state portals use the same layout.
portal:
  name: Rajasthan eProcurement
  base_url: https://eproc.rajasthan.gov.in
  home_url: https://eproc.rajasthan.gov.in/nicgep/app
  request_delay_seconds: 0.5
  timeout_seconds: 60
  verify_tls: false

# The LLM uses this profile to decide which tenders are worth reading.
# Edit freely: describe what kind of tenders matter to you.
profile:
  description: >
    A contractor / supplier in Rajasthan looking for tenders worth bidding on.
    Prefer tenders with a clear scope, a reasonable bid window (at least 5 days left),
    an open tender type, and a disclosed tender value. Flag very large works that need
    special class registration, very short deadlines, and re-tenders.
  interests:
    - civil works
    - roads
    - buildings
    - water supply and pipelines
    - electrical works
    - solar and power
    - IT hardware and services
    - medical equipment
  locations:
    - Jaipur
    - Jodhpur
    - Udaipur
    - Kota
    - Ajmer
    - Bikaner
  min_value_inr: 0
  max_value_inr: 0   # 0 = no upper limit

llm:
  # Free-tier, OpenAI-compatible providers, tried in order. A provider is used only if its
  # API key is set as a GitHub repository secret with the name given in api_key_env.
  batch_size: 8
  providers:
    - name: gemini
      endpoint: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      api_key_env: GEMINI_API_KEY
      models:
        - gemini-3.8-flash
      max_requests_per_run: 200
      seconds_between_requests: 6    # stay under the free-tier requests/minute limit
    - name: groq
      endpoint: https://api.groq.com/openai/v1/chat/completions
      api_key_env: GROQ_API_KEY
      models:
        - openai/gpt-oss-120b
        - qwen/qwen3.8-27b
      max_requests_per_run: 400      # free tier: ~1,000 requests/day
      seconds_between_requests: 40   # free tier: 8K tokens/minute; one batch is ~5K tokens

site:
  title: Rajasthan Govt Tenders - Daily Report
  keep_closed_days: 7    # show recently closed tenders on the site
  prune_closed_days: 60  # drop closed tenders from the database after this many days
