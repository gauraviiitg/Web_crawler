# Portal to crawl (NIC GePNIC software). Other NIC state portals use the same layout.
portal:
  name: Rajasthan eProcurement
  base_url: https://eproc.rajasthan.gov.in
  home_url: https://eproc.rajasthan.gov.in/nicgep/app
  request_delay_seconds: 0.5
  timeout_seconds: 60
  verify_tls: false

# The LLM uses this profile to decide which tenders are worth reading.
# Edit freely: describe what kind of tenders matter to you.
profile:
  description: >
    A brand-new company based in Jaipur with no past government contracts, no turnover
    history and almost no cash. It wants its FIRST government order. It can register as an
    MSE (Udyam) and as an iStart Rajasthan startup, and can buy goods from Jaipur wholesalers
    or OEM dealers after winning (trading / supply model). It cannot do civil works (no PWD
    contractor class registration), cannot hold licences such as drug licence or OEM dealership
    yet, and cannot fund large stock, fleets or big labour teams up front.
  # Hard limits used by both the LLM prompt and the keyword fallback.
  base_location: Jaipur
  experience_years: 0
  budget_inr: 0            # cash available for fees/EMD/stock before the first payment
  max_upfront_inr: 10000   # most fees + EMD that can be borrowed to submit one bid
  max_value_inr: 2500000   # prefer first orders up to Rs 25 lakh (working capital risk)
  min_days_left: 5         # time needed to get a DSC, enrol on the portal and prepare the bid
  interests:
    - photocopy and photostat services
    - stationery
    - office supplies
    - canvas bags
    - printing
    - computer peripherals
    - furniture
    - housekeeping material
    - uniforms
    - sports equipment
    - general items for offices
  locations:
    - Jaipur
  min_value_inr: 0

llm:
  # Free-tier, OpenAI-compatible providers, tried in order. A provider is used only if its
  # API key is set as a GitHub repository secret with the name given in api_key_env.
  batch_size: 8
  providers:
    - name: gemini
      endpoint: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      api_key_env: GEMINI_API_KEY
      models:
        - gemini-3.8-flash
      max_requests_per_run: 200
      seconds_between_requests: 6    # stay under the free-tier requests/minute limit
    - name: groq
      endpoint: https://api.groq.com/openai/v1/chat/completions
      api_key_env: GROQ_API_KEY
      models:
        - openai/gpt-oss-120b
        - qwen/qwen3.8-27b
      max_requests_per_run: 400      # free tier: ~1,000 requests/day
      seconds_between_requests: 40   # free tier: 8K tokens/minute; one batch is ~5K tokens

# Personalised sections: tenders matching a section get their own list on the site
# ("Personalised" tab), a relevance boost, and are tagged by the LLM too.
# Keywords match whole words (plural "s"/"es" allowed), case-insensitive.
personalised:
  - id: photocopy
    name_en: Photocopy & printing
    name_hi: फोटोकॉपी व प्रिंटिंग
    description: >
      Photocopy / photostat / xerox job work, computer typing and plotting, printing of forms,
      registers and stationery, printers, copiers, toner and cartridges, scanning and
      digitisation, lamination, flex and banner printing.
    keywords:
      - photocopy
      - photocopies
      - photocopier
      - photocopying
      - photo copy
      - photostat
      - photostate
      - xerox
      - copier
      - duplicating
      - printing
      - printer
      - printed
      - toner
      - cartridge
      - scanning
      - scanner
      - digitisation
      - digitization
      - lamination
      - flex
      - banner
      - plotter
      - poltter
      - book binding
      - spiral binding
      - computer typing

briefing:
  top_picks: 6      # tenders shown in the daily "top picks for us" section
  candidates: 15    # feasible tenders sent to the LLM to choose from

site:
  title: Rajasthan Govt Tenders - Daily Report
  keep_closed_days: 7    # show recently closed tenders on the site
  prune_closed_days: 60  # drop closed tenders from the database after this many days
